# rattler-build recipe, intended for conda-forge/staged-recipes (after pele is on conda-forge).
# local test: rattler-build build -r conda-recipe/recipe.yaml -c conda-forge -c <channel with pele>
context:
  name: PyCG_DESCENT
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  # TODO(release): switch to the tagged tarball + sha256 for conda-forge
  path: ..

build:
  number: 0
  skip:
    - win
  script:
    env:
      PYCGD_NATIVE: "0"  # portable binaries, no -march=native
    content: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake >=3.18
    - ninja
  host:
    - python
    - pip
    - setuptools >=65
    - wheel
    - cython >=3
    - numpy
    - pele
    - eigen
  run:
    - python
    - pele
    - numpy

tests:
  - python:
      imports:
        - PyCG_DESCENT
        - PyCG_DESCENT._pycgd
      pip_check: false

about:
  homepage: https://github.com/martiniani-lab/PyCG_DESCENT
  summary: Python wrapper for the CG_DESCENT algorithm by Hager and Zhang
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - spraharsh
